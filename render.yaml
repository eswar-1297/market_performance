# Render blueprint — https://render.com/docs/blueprint-spec
#
# A Postgres database, and one web service that serves both the API and the
# built React app, so there is a single URL and no CORS to think about.
#
# The data lives in Postgres, so the web service can be free: a free instance
# sleeps when idle and restarts cold, but nothing is lost when it does.

databases:
  - name: marketing-sheet
    plan: free
    databaseName: marketing
    user: marketing

services:
  - type: web
    name: marketing-performance
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci --omit=dev
    # seed only fills an empty database; restructure only fixes what has drifted
    startCommand: cd server && npm run deploy
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: marketing-sheet
          property: connectionString
